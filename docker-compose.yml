services:
  postgres:
    image: postgres:18-alpine
    container_name: sluicegate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: migration
      POSTGRES_PASSWORD: migration
      POSTGRES_DB: migration
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      - sluicegate_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration -d migration"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  sluicegate_pgdata:
